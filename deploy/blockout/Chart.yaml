apiVersion: v2
name: blockout
description: Blockout, multiplication as area for 3rd graders. The games, live classes and accounts, with everything they run on - MongoDB, Valkey (Redis) and Keycloak with its Postgres - and their backups.
type: application
# The chart's own version; release.yml sets both to the release's version.
version: 0.10.0
appVersion: "0.10.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/DeepSpaceCartel/blockout
sources:
  - https://github.com/DeepSpaceCartel/blockout
dependencies:
  # Keycloak itself; the chart adds its Postgres, realm, address and settings
  - name: keycloakx
    version: 7.3.2
    repository: https://codecentric.github.io/helm-charts
    condition: keycloak.enabled
