{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "blockout.fullname" . }}
  labels: {{- include "blockout.labels" . | nindent 4 }}
spec:
  parentRefs: {{- required "httpRoute.parentRefs: the Gateway (and listener) to attach to" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames: {{- required "httpRoute.hostnames: e.g. blockout.example.org" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "blockout.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
