# The production cluster (M8 in the production-readiness plan): more servers,
# autoscaling, an image pinned by digest. Hostnames and the gateway are
# placeholders until that cluster exists.
replicaCount: 3
image:
  # digest: sha256:… (set by the deploy, so a tag can't move under it)
  pullPolicy: IfNotPresent
publicUrl: https://blockout.example.org
httpRoute:
  hostnames: [blockout.example.org]
  parentRefs:
    - name: gateway
      namespace: gateway
keycloak:
  url: https://id.example.org
  httpRoute:
    parentRefs:
      - name: gateway
        namespace: gateway
mongo:
  storage: 20Gi
backup:
  enabled: true
  # backup.rclone (or existingSecret) at install time
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 768Mi }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
podDisruptionBudget:
  minAvailable: 2
networkPolicy:
  enabled: true
