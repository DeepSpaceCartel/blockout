# MongoDB for Blockout's accounts (apply with -n <namespace>): one member of
# the replica set rs0 (transactions need a replica set, even of one). The root
# password and the members' shared key come from the blockout-mongo Secret
# that install.sh creates, never from this repo.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None # each member by name: mongo-0.mongo.<namespace>.svc
  selector: { app: mongo }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      # The image's mongodb user; fsGroup lets it own the volume
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # mongod wants the replica set key readable by its owner only
        - name: keyfile
          image: mongo:8.0.34
          command: [sh, -c, 'cp /secret/keyfile /key/keyfile && chmod 400 /key/keyfile']
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: secret, mountPath: /secret, readOnly: true }
            - { name: key, mountPath: /key }
      containers:
        - name: mongo
          image: mongo:8.0.34
          args: [--replSet, rs0, --bind_ip_all, --keyFile, /key/keyfile]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: blockout-mongo, key: root-password } }
          ports: [{ name: mongo, containerPort: 27017 }]
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, 'db.adminCommand("ping").ok'] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: key, mountPath: /key, readOnly: true }
      volumes:
        - name: secret
          secret: { secretName: blockout-mongo, items: [{ key: keyfile, path: keyfile }] }
        - { name: key, emptyDir: { medium: Memory } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # Hetzner volumes start at 10 GB
        resources: { requests: { storage: 10Gi } }
