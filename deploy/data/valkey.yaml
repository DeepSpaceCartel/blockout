# Valkey (a Redis-compatible server, BSD licensed) for Blockout's live classes
# (apply with -n <namespace>). Rooms are small and last hours, so no volume:
# a restart only ends the classes running at the time. The password comes
# from the blockout-redis Secret that install.sh creates.
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: { app: valkey }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine
          # The password from the environment, not the command line (it would show in ps)
          command: [sh, -c, 'exec valkey-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$VALKEY_PASSWORD"']
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: blockout-redis, key: password } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [sh, -c, 'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG'] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: tmp, mountPath: /data }]
      volumes: [{ name: tmp, emptyDir: {} }]
