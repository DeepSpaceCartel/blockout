# Nightly backup of Blockout's MongoDB (apply with -n <namespace>, next to it).
# mongodump writes one compressed archive; rclone copies it through its "crypt"
# remote, so the copy is encrypted before it leaves the cluster, to object
# storage: daily/ (kept 31 days) and, on the 1st, monthly/ (kept a year).
#
# Where it goes comes from the blockout-backup Secret: rclone's settings as
# environment variables (see docs/guides/operate.md), e.g.
#   RCLONE_CONFIG_STORE_TYPE=s3  RCLONE_CONFIG_STORE_PROVIDER=…  RCLONE_CONFIG_STORE_ENDPOINT=…
#   RCLONE_CONFIG_STORE_ACCESS_KEY_ID=…  RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY=…
#   RCLONE_CONFIG_CRYPT_TYPE=crypt  RCLONE_CONFIG_CRYPT_REMOTE=store:<bucket>/blockout
#   RCLONE_CONFIG_CRYPT_PASSWORD=<rclone obscure …>   (keep the plain password in 1Password: restores need it)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blockout-backup
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: mongo:8.0.34
              command: [sh, -c, 'mongodump --uri "$MONGO_URL" --gzip --archive="/backup/blockout-$(date -u +%Y-%m-%d).archive.gz" && ls -l /backup']
              env:
                - name: MONGO_URL
                  valueFrom: { secretKeyRef: { name: blockout-mongo, key: url } }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          containers:
            - name: upload
              image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              command:
                - sh
                - -c
                - |
                  set -e
                  rclone mkdir crypt:daily && rclone mkdir crypt:monthly  # (deleting old copies needs both)
                  rclone copy /backup crypt:daily
                  if [ "$(date -u +%d)" = 01 ]; then rclone copy /backup crypt:monthly; fi
                  rclone delete --min-age 31d crypt:daily
                  rclone delete --min-age 366d crypt:monthly
                  rclone lsl crypt: | tail -5
              envFrom:
                - secretRef: { name: blockout-backup }
              env:
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # (settings come from the environment; nothing to read)
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: backup, emptyDir: { sizeLimit: 2Gi } }
            - { name: tmp, emptyDir: {} }
