# A tag like v0.4.0 publishes a release:
#   - the image ghcr.io/<owner>/blockout:<version> (and :<sha>), with an SBOM and a
#     signed build provenance attestation
#   - the Helm chart oci://ghcr.io/<owner>/charts/blockout:<version>
#   - a GitHub release with that version's CHANGELOG section
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # ghcr.io
      id-token: write # signing the attestation
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Names
        id: names
        # (a tag is only accepted as a version: v1.2.3, optionally -something)
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version tag: $VERSION" >&2; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/blockout" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # (values reach the shell as environment variables, never pasted into the script)
      - name: Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CHART_VERSION: ${{ steps.names.outputs.version }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package deploy/blockout --version "$CHART_VERSION" --app-version "$CHART_VERSION" -d /tmp/chart
          helm push /tmp/chart/blockout-*.tgz "$CHARTS"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.names.outputs.version }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # this version's section of CHANGELOG.md
          awk -v v="$RELEASE" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > /tmp/notes.md
          printf '\nImage: `%s:%s` (`%s`)\n' "$IMAGE" "$RELEASE" "$DIGEST" >> /tmp/notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/notes.md --verify-tag
