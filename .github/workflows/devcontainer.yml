# Builds the dev container (image, features, postCreateCommand.sh) and checks the
# tools work inside it, whenever something it installs changes, and weekly to catch
# a base image or feature that broke upstream.
name: devcontainer

on:
  pull_request:
    paths:
      - .devcontainer/**
      - package-lock.json
      - docs/requirements.txt
      - .github/workflows/devcontainer.yml
  push:
    branches: [main, 'v*']
    paths:
      - .devcontainer/**
      - package-lock.json
      - docs/requirements.txt
      - .github/workflows/devcontainer.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -e
            node .devcontainer/check.mjs
            gh --version
            cloudflared --version
            coder version
            test -n "$(ls ~/.claude/skills)"
            node -e "require('playwright').chromium.launch().then(b => b.close())"
            npm run lint
            npm test
            .venv/bin/mkdocs build --strict
