# Keeps the pinned action SHAs (with their version comments), npm packages and the
# dev container current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ['*']
  # The ghcr.io features in .devcontainer/devcontainer.json. Not the image (its
  # 5-26-trixie tag already floats within image version 5) or the local features in
  # .devcontainer/features, whose versions are bumped by hand.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
